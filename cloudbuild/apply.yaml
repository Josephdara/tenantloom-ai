steps:
  - id: fetch-plans
    name: gcr.io/google.com/cloudsdktool/cloud-sdk:587.0.0-slim
    entrypoint: bash
    args:
      - -c
      - mkdir -p plans && gcloud storage cp "gs://${_STATE_BUCKET}/plans/${COMMIT_SHA}/*.tfplan" plans/

  - id: apply
    name: hashicorp/terraform:1.16.4
    entrypoint: sh
    args: ["cloudbuild/scripts/tf-states.sh", "apply"]
    env:
      - STATE_BUCKET=${_STATE_BUCKET}

timeout: 1800s

options:
  logging: CLOUD_LOGGING_ONLY
  substitutionOption: ALLOW_LOOSE
  env:
    - TF_IN_AUTOMATION=1
