# Pull request check: format, validate, and plan with read-only access. Nothing is saved.

steps:
  - id: config
    name: gcr.io/google.com/cloudsdktool/cloud-sdk:587.0.0-slim
    entrypoint: gcloud
    args: ["storage", "cp", "gs://${_STATE_BUCKET}/config/${_LAYER}.auto.tfvars.json", "${_TF_DIR}/"]

  - id: fmt
    name: hashicorp/terraform:1.16.4
    args: ["-chdir=${_TF_DIR}", "fmt", "-check", "-recursive"]

  - id: init
    name: hashicorp/terraform:1.16.4
    args:
      - -chdir=${_TF_DIR}
      - init
      - -input=false
      - -backend-config=bucket=${_STATE_BUCKET}
      - -backend-config=prefix=${_STATE_PREFIX}

  - id: validate
    name: hashicorp/terraform:1.16.4
    args: ["-chdir=${_TF_DIR}", "validate"]

  - id: plan
    name: hashicorp/terraform:1.16.4
    args: ["-chdir=${_TF_DIR}", "plan", "-input=false", "-lock=false"]

timeout: 1200s

options:
  logging: CLOUD_LOGGING_ONLY
  substitutionOption: ALLOW_LOOSE
  env:
    - TF_IN_AUTOMATION=1
