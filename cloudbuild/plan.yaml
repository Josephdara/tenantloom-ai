# Main branch plan: saves the plan and its hash for the approval-gated apply build of the same commit.

steps:
  - id: config
    name: gcr.io/google.com/cloudsdktool/cloud-sdk:587.0.0-slim
    entrypoint: gcloud
    args: ["storage", "cp", "gs://${_STATE_BUCKET}/config/${_LAYER}.auto.tfvars.json", "${_TF_DIR}/"]

  - id: init
    name: hashicorp/terraform:1.16.4
    args:
      - -chdir=${_TF_DIR}
      - init
      - -input=false
      - -backend-config=bucket=${_STATE_BUCKET}
      - -backend-config=prefix=${_STATE_PREFIX}

  - id: plan
    name: hashicorp/terraform:1.16.4
    args: ["-chdir=${_TF_DIR}", "plan", "-input=false", "-lock=false", "-out=tfplan"]

  - id: show
    name: hashicorp/terraform:1.16.4
    args: ["-chdir=${_TF_DIR}", "show", "-no-color", "tfplan"]

  - id: upload
    name: gcr.io/google.com/cloudsdktool/cloud-sdk:587.0.0-slim
    entrypoint: bash
    args:
      - -c
      - |
        set -euo pipefail
        cd "${_TF_DIR}"
        sha256sum tfplan > tfplan.sha256
        # gcloud reads each destination object before writing it, so plan identities can read their own layer's prefix.
        dest="gs://${_PLAN_BUCKET}/${_LAYER}/${BUILD_ID}"
        gcloud storage cp tfplan "$${dest}/tfplan"
        gcloud storage cp tfplan.sha256 "$${dest}/tfplan.sha256"

timeout: 1200s

options:
  logging: CLOUD_LOGGING_ONLY
  substitutionOption: ALLOW_LOOSE
  env:
    - TF_IN_AUTOMATION=1
